<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="View photos of Grace Farms - poultry and livestock operations in Jejeti, Ghana. See our broilers, layers, goats, sheep, and farm facilities.">
    <meta name="keywords" content="Grace Farms gallery, poultry farm photos Ghana, livestock farm images, farm operations Jejeti">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Gallery - Grace Farms Poultry & Livestock">
    <meta property="og:description" content="Take a visual tour of Grace Farms in Jejeti, Eastern Region. See our animals, facilities, and daily operations.">
    <meta property="og:image" content="images/farm-1.jpg">
    <meta property="og:url" content="https://gracefarms.com/gallery.html">
    <meta property="og:type" content="website">
    
    <title>Gallery - Grace Farms | See Our Farm in Jejeti, Ghana</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Page Banner -->
        <section class="page-banner">
            <div class="container">
                <h1>Our Farm Gallery</h1>
                <p>Take a visual tour of Grace Farms</p>
            </div>
        </section>

        <!-- Gallery Grid -->
        <section class="gallery section-padding">
            <div class="container">
                <div class="gallery-grid">
                    <div class="gallery-item" onclick="openLightbox(0)">
                        <picture>
                            <source srcset="images/farm-1.webp" type="image/webp">
                            <img src="images/farm-1.jpg" alt="Broiler chicken house at Grace Farms" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Broiler Chicken House</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(1)">
                        <picture>
                            <source srcset="images/farm-2.webp" type="image/webp">
                            <img src="images/farm-2.jpg" alt="Layer chickens in cage system" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Layer Chickens</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(2)">
                        <picture>
                            <source srcset="images/farm-3.webp" type="image/webp">
                            <img src="images/farm-3.jpg" alt="Fresh eggs collection at Grace Farms" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Fresh Eggs Collection</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(3)">
                        <picture>
                            <source srcset="images/farm-4.webp" type="image/webp">
                            <img src="images/farm-4.jpg" alt="Goats grazing at Grace Farms" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Goat Herd Grazing</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(4)">
                        <picture>
                            <source srcset="images/farm-5.webp" type="image/webp">
                            <img src="images/farm-5.jpg" alt="Sheep flock at the farm" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Sheep Flock</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(5)">
                        <picture>
                            <source srcset="images/farm-6.webp" type="image/webp">
                            <img src="images/farm-6.jpg" alt="Turkey birds at Grace Farms" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Turkey Birds</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(6)">
                        <picture>
                            <source srcset="images/farm-7.webp" type="image/webp">
                            <img src="images/farm-7.jpg" alt="Feed storage and preparation area" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Feed Preparation Area</div>
                    </div>
                    <div class="gallery-item" onclick="openLightbox(8)">
                        <picture>
                            <source srcset="images/farm-8.webp" type="image/webp">
                            <img src="images/farm-8.jpg" alt="Farm staff with livestock" loading="lazy">
                        </picture>
                        <div class="gallery-caption">Our Dedicated Team</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="Gallery image">
        <div class="lightbox-caption" id="lightbox-caption"></div>
        <button class="lightbox-prev" onclick="changeImage(-1)">&#10094;</button>
        <button class="lightbox-next" onclick="changeImage(1)">&#10095;</button>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/233200000000" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
        <span class="whatsapp-icon">💬</span>
    </a>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
